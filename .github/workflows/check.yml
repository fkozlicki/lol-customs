name: Check
on:
  push:
    paths:
      - '**'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: 🔦 Run linter
        run: bun run lint
      - name: 🪐 Check TypeScript
        run: bun run typecheck
      - name: 🧪 Run tests
        run: bun run test

  # Stories are the one thing the checks above cannot judge: `storybook build` compiles them but
  # never renders them, and the framework's error boundary turns a throwing story into an empty one.
  # This renders every story in every locale and fails on a console error or on nothing being drawn.
  stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build Storybook
        run: bun x turbo build-storybook --filter=@v1/app
        # `src/env.mjs` validates on import, in the browser bundle too, and `skipValidation` reads
        # `process.env.CI`, which only exists on the Node side. Stories never reach Supabase, but any
        # that import the env module need these defined, so the build gets placeholders.
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: storybook-placeholder
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install the browser
        run: bun run --cwd apps/app playwright install --with-deps chromium
      - name: 📖 Render every story
        run: bun run --cwd apps/app test:stories
