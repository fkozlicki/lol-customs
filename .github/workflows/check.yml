name: Check
on:
  push:
    paths:
      - '**'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: 🔦 Run linter
        run: bun run lint
      - name: 🪐 Check TypeScript
        run: bun run typecheck
      - name: 🧪 Run tests
        run: bun run test
      - name: 🎭 Install Chromium for the story tests
        working-directory: apps/storybook
        run: bunx playwright install --with-deps chromium
      - name: 📚 Run story tests (render, interactions, accessibility; every locale and theme)
        working-directory: apps/storybook
        run: bun run test:stories
